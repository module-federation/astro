name: Release

on:
  workflow_dispatch:

jobs:
  publish-latest:
    name: Publish package (npm)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changeset needs full git history

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      # Update npm to the latest version to enable OIDC
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm i

      - name: Build package
        run: pnpm run build:package

      - name: Resolve npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p 'require("./packages/astro/package.json").version')
          TAG=$(node -p 'const version = require("./packages/astro/package.json").version; const prerelease = version.match(/-([0-9A-Za-z-]+)/); prerelease ? prerelease[1] : "latest"')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION with tag $TAG"

      - name: Publish to npm
        run: pnpm -r publish --tag ${{ steps.npm-tag.outputs.tag }}
          