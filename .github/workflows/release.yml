name: Release

on:
  workflow_dispatch:

jobs:
  publish-latest:
    name: Publish package (npm)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changeset needs full git history

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      # Update npm to the latest version to enable OIDC
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: Resolve npm tag
        id: npm-tag
        run: |
          TAG=$(node -e "const version = require('./package.json').version; const prerelease = version.match(/-([0-9A-Za-z-]+)/); process.stdout.write(prerelease ? prerelease[1] : 'latest');")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version $(node -p \"require('./package.json').version\") with tag $TAG"

      - name: Publish to npm
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }}
