name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package and examples
        run: pnpm turbo run build --filter=@module-federation/astro --filter="example-*"

      - name: Test package
        run: pnpm turbo run test --filter=@module-federation/astro

      - name: Typecheck package
        run: pnpm turbo run typecheck --filter=@module-federation/astro

      - name: Lint package
        run: pnpm turbo run lint --filter=@module-federation/astro

      - name: Check package formatting
        run: pnpm turbo run fmt.check --filter=@module-federation/astro
